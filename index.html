<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PittCare has moved</title>

  <!-- Automatic redirect after 3 seconds (works without JavaScript) -->
  <meta http-equiv="refresh" content="3; url=https://www.familymedicine.pitt.edu/pittcare">
  <!-- Tells search engines the official page is the canonical one -->
  <link rel="canonical" href="https://www.familymedicine.pitt.edu/pittcare">

  <style>
    :root {
      --bg: #ffffff;
      --text: #1c1c1c;
      --muted: #555555;
      --link: #003594;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --text: #f0f0f0;
        --muted: #b0b4ba;
        --link: #8fb3ff;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 0.75rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    a { color: var(--link); font-weight: 600; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>PittCare has a new home</h1>
    <p>This page has moved to the official Department of Family Medicine website. You will be redirected in a few seconds.</p>
    <p>If nothing happens, go to:<br>
      <a href="https://www.familymedicine.pitt.edu/pittcare">https://www.familymedicine.pitt.edu/pittcare</a>
    </p>
  </main>

  <script>
    // Faster redirect for browsers with JavaScript enabled
    setTimeout(function () {
      window.location.replace("https://www.familymedicine.pitt.edu/pittcare");
    }, 1500);
  </script>
</body>
</html>
